<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notarity — AI Notary Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-[#f8f8f8] text-[#13044f] antialiased overflow-hidden;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            }
        }

        @layer components {
            .premium-card {
                @apply bg-white border border-[#13044f]/5 rounded-[2rem] p-8 transition-all duration-700 ease-[cubic-bezier(0.4,0,0.2,1)] shadow-sm;
            }
            .premium-card:hover {
                @apply shadow-xl border-[#501dff]/20 -translate-y-1;
            }
            .text-accent {
                @apply text-[#501dff];
            }
            .bg-accent {
                @apply bg-[#501dff];
            }
        }

        .reveal-text {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .is-loaded .reveal-text {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .main-container {
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .is-transitioned .main-container {
            transform: translateY(-8vh);
        }

        .action-blocks {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .is-transitioned .action-blocks {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">

    <div id="app" class="w-full max-w-4xl px-8 relative">
        <div class="main-container text-center space-y-12">
            
            <h1 class="reveal-text text-4xl md:text-5xl lg:text-6xl font-semibold tracking-tight leading-[1.1] max-w-3xl mx-auto text-[#13044f]">
                I am your <span class="text-accent">AI assistant</span>. <br class="hidden md:block">
                <span class="opacity-50">Where should we begin?</span>
            </h1>

            <p class="reveal-text delay-300 text-lg md:text-xl text-[#13044f]/60 max-w-2xl mx-auto leading-relaxed">
                Drop a document for structure analysis, or describe your situation for a tailored notary solution.
            </p>

            <div class="action-blocks grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                
                <div id="drop-zone" class="premium-card group cursor-pointer flex flex-col items-center justify-center text-center space-y-4 border-dashed border-2 border-[#13044f]/10 hover:border-[#501dff]/50">
                    <input type="file" id="file-input" class="hidden" accept="application/pdf">
                    <div class="w-12 h-12 rounded-full bg-[#501dff]/10 flex items-center justify-center group-hover:scale-110 transition-transform duration-500">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-accent">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-lg font-medium text-[#13044f] group-hover:text-accent transition-colors">Drop a document</h3>
                        <p class="text-sm text-[#13044f]/40 mt-1" id="upload-status">PDF, DOCX, or Images</p>
                    </div>
                </div>

                <div class="premium-card flex flex-col space-y-4 text-left items-start focus-within:ring-2 focus-within:ring-[#501dff]/20">
                    <div class="w-full flex justify-between items-center">
                        <h3 class="text-lg font-medium text-[#13044f]">Describe situation</h3>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-accent/50">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                        </svg>
                    </div>
                    <textarea 
                        class="w-full bg-transparent border-none focus:ring-0 text-[#13044f]/80 placeholder:text-[#13044f]/20 resize-none h-24 text-sm" 
                        placeholder="e.g. I need to notarize a power of attorney for a property sale abroad..."></textarea>
                </div>

            </div>

            <div id="results" class="hidden space-y-6 pt-8 text-left max-w-2xl mx-auto">
                <div class="premium-card bg-[#501dff]/5 border-[#501dff]/10">
                    <h2 class="text-xl font-semibold text-[#13044f] flex items-center">
                        <span class="w-8 h-8 rounded-full bg-accent text-white flex items-center justify-center mr-3 text-sm">AI</span>
                        Analysis Result
                    </h2>
                    <div class="mt-4 space-y-2">
                        <p class="text-[#13044f]/60">Predicted Destination Country: <span id="res-country" class="font-bold text-[#13044f]">...</span></p>
                        <div id="products-list" class="space-y-3 mt-4">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const statusText = document.getElementById('upload-status');
            const resultsSection = document.getElementById('results');
            const resCountry = document.getElementById('res-country');
            const productsList = document.getElementById('products-list');
            
            setTimeout(() => {
                body.classList.add('is-loaded');
            }, 300);

            setTimeout(() => {
                body.classList.add('is-transitioned');
            }, 1200);

            dropZone.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                statusText.innerText = `Uploading ${file.name}...`;
                
                const formData = new FormData();
                formData.append('file', file);

                try {
                    const response = await fetch('/ai/analyze-document', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) throw new Error('Failed to analyze document');

                    const data = await response.json();
                    showResults(data);
                } catch (error) {
                    statusText.innerText = 'Error: ' + error.message;
                    console.error(error);
                }
            });

            function showResults(data) {
                statusText.innerText = 'Analysis complete!';
                resultsSection.classList.remove('hidden');
                resCountry.innerText = data.destinationCountry;
                
                productsList.innerHTML = '<h3 class="font-medium text-[#13044f]">Available Products:</h3>';
                
                if (data.products && data.products.length > 0) {
                    data.products.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'p-4 bg-white border border-[#13044f]/5 rounded-xl shadow-sm flex justify-between items-center';
                        card.innerHTML = `
                            <div>
                                <h4 class="font-semibold text-[#13044f]">${p.title?.en || p.title || 'Product'}</h4>
                                <p class="text-xs text-[#13044f]/40">${p.description?.en || ''}</p>
                            </div>
                            <div class="text-accent font-bold">€${(p.baseFee / 100).toFixed(2)}</div>
                        `;
                        productsList.appendChild(card);
                    });
                } else {
                    productsList.innerHTML += '<p class="text-sm text-[#13044f]/40">No specific products found for this country.</p>';
                }

                resultsSection.scrollIntoView({ behavior: 'smooth' });
            }
        });
    </script>
</body>
</html>
